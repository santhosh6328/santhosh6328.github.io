<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Construction</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #1e1e24 0%, #111116 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        .icon { font-size: 64px; animation: pulse 2s infinite; }
        h1 { margin: 20px 0; background: linear-gradient(45deg, #ffaa00, #ff5500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #a0a0a5; margin-bottom: 30px; }
        .stripe { height: 6px; background: repeating-linear-gradient(45deg, #ffaa00, #ffaa00 10px, #111116 10px, #111116 20px); }
        .email-form { display: flex; gap: 10px; max-width: 400px; margin: 0 auto; }
        .email-form input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.2); color: #fff; }
        .email-form button { padding: 12px 24px; border: none; background: #ffaa00; border-radius: 8px; cursor: pointer; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @media (max-width: 480px) { .email-form { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>Under Construction</h1>
        <div class="stripe"></div>
        <p>We are building something new! Check back soon.</p>
        <form class="email-form" onsubmit="event.preventDefault(); alert('Thank you!');">
            <input type="email" placeholder="Your email" required>
            <button type="submit">Notify Me</button>
        </form>
    </div>
</body>
</html>
